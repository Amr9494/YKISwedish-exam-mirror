<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YKI Swedish – Exam Mirror</title>
<meta name="description" content="Practise the YKI Swedish (intermediate level) speaking test like in the real exam: dialogues, reacting, telling and giving your opinion. Listen, answer, record, compare.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#005293">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="linkish" id="homeBtn" aria-label="Home"><img src="icon.svg" alt="" class="logo"> YKI <span>Exam Mirror</span></button>
  <button class="icon" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
</header>

<main id="view" tabindex="-1"></main>

<dialog id="settings">
  <form method="dialog" class="settings">
    <h2>Settings</h2>
    <label>Voice
      <select id="setVoice"></select>
    </label>
    <label>Speech speed
      <select id="setRate">
        <option value="0.7">Slow</option>
        <option value="0.85">Calm</option>
        <option value="1">Normal (exam)</option>
      </select>
    </label>
    <label>Answer time when the task gives none
      <select id="setSeconds">
        <option value="15">15 seconds</option>
        <option value="20">20 seconds</option>
        <option value="25">25 seconds</option>
        <option value="30">30 seconds</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="setShowLine"> Show the other person's words while listening (easier)</label>
    <label class="check"><input type="checkbox" id="setEnglish"> Show English help</label>
    <p class="muted small" id="voiceNote"></p>
    <div class="row end"><button value="close" class="primary">Done</button></div>
  </form>
</dialog>

<footer>Practice material for the YKI Swedish test. Not affiliated with the YKI test organisers. Recordings stay in your browser. Listening audio: Swedish voice Piper NST (CC0), English voice Piper Ryan (CC BY-NC-SA 4.0).</footer>
<script src="data/dialogs.js"></script>
<script src="data/toolkit.js"></script>
<script src="data/tasks.js"></script>
<script src="data/listening.js"></script>
<script src="data/write.js"></script>
<script src="data/material.js"></script>
<script src="app.js"></script>
</body>
</html>
