<style>
:root{--bg:#e9edf2;--panel:#ffffff;--ink:#1d2733;--mut:#5d6b7a;--line:#d5dce4;--acc:#00527e;--hl:#fff3c4;--ph:#c9d3de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--panel:#1a222b;--ink:#e6ebf0;--mut:#9aa8b6;--line:#2c3744;--acc:#7cc4f0;--hl:#4a3f10;--ph:#3a4756;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161c;--panel:#1a222b;--ink:#e6ebf0;--mut:#9aa8b6;--line:#2c3744;--acc:#7cc4f0;--hl:#4a3f10;--ph:#3a4756;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 6px 0 0;white-space:nowrap}
.grp{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:34px}
button{cursor:pointer}
button[aria-pressed="true"]{background:var(--acc);color:var(--panel);border-color:var(--acc)}
input[type=number]{width:62px}
label.s{font-size:13px;color:var(--mut)}
#side{width:310px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 6px 40px}
body.noside #side{display:none}
#side a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
#side a i{font-style:normal;color:var(--mut);font-size:12px}
#side a:hover{background:var(--bg)}
#side a.act{background:var(--hl);font-weight:600}
#side details>details,#side details>a,#side details>summary~a{margin-left:14px}
#side summary{cursor:pointer;list-style:none;display:flex}
#side summary::before{content:"▸";width:14px;color:var(--mut);padding-top:5px;flex:none}
#side details[open]>summary::before{content:"▾"}
#side summary a{flex:1;margin-left:0}
#side details>details{margin-left:14px}
main{position:relative;overflow:auto;padding:14px 12px 60px;scroll-behavior:auto}
.wrap{width:var(--pw,820px);margin:0 auto}
.pg{margin:0 0 18px;content-visibility:auto;contain-intrinsic-size:auto calc(var(--pw,820px)*1.4143 + 20px)}
.pg svg{display:block;width:100%;aspect-ratio:595.3/841.9;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.12);color-scheme:light}
.cap{text-align:center;font-size:11px;color:var(--mut);padding-top:5px}
svg text{white-space:pre;font-family:"Palatino Linotype","Book Antiqua",Palatino,"P052","URW Palladio L","TeX Gyre Pagella",Georgia,serif}
.s0{fill:rgb(95,95,95)}.s1{font-weight:bold;fill:rgb(0,82,147)}.s2{fill:rgb(0,0,0)}.s3{font-weight:bold;fill:rgb(0,0,0)}.s4{font-style:italic;fill:rgb(0,0,0)}.s5{font-style:italic;fill:rgb(0,0,0)}.s5 text{font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;}.s6{fill:rgb(0,0,0)}.s6 text{font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;}.s7{fill:rgb(255,255,255)}.s7 text{font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;}.s8{font-weight:bold;fill:rgb(255,255,255)}.s9{font-weight:bold;fill:rgb(0,120,55)}.s10{font-style:italic;fill:rgb(95,95,95)}.s11{font-weight:bold;font-style:italic;fill:rgb(95,95,95)}.s12{font-style:italic;fill:rgb(95,95,95)}.s12 text{font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;}.s13{font-weight:bold;font-style:italic;fill:rgb(0,82,147)}.s14{font-weight:bold;font-style:italic;fill:rgb(255,255,255)}.s15{font-style:italic;fill:rgb(255,255,255)}.s15 text{font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;}
.ph{display:none;fill:#c9d3de;rx:1.5px}
.sv text,.en text{cursor:pointer}
body:not(.hsv) .sv text:hover{fill:#d97706}
body:not(.hen) .en text:hover{fill:#d97706}
body.hsv .sv text:not(.rv),body.hen .en text:not(.rv){fill:transparent;stroke:var(--ph);stroke-width:3.2px;stroke-linejoin:round;stroke-linecap:round}

text.say{fill:#d97706}
.lk{fill:transparent;cursor:pointer}
.lk:hover{fill:rgba(0,82,126,.12)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1d2733;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;max-width:90vw;display:none;z-index:30}
@media (max-width:900px){
 #side{position:fixed;z-index:20;top:0;bottom:0;left:0;max-width:86vw;padding-top:calc(10px + env(safe-area-inset-top,0px));box-shadow:0 0 30px rgba(0,0,0,.35)}
 header h1{display:none}
}
</style>

<div id="toast" role="status"></div>
<script>
const TOC=[],LAB={},N=9,K=595.3;
const $=s=>document.querySelector(s),main=$('#main'),narrow=()=>innerWidth<=900;
function load(){try{return JSON.parse(localStorage.getItem('yki3'))||{}}catch(e){return{}}}
const S=Object.assign({hsv:0,hen:0,mode:'word',rate:.8,zoom:1,page:1},load());
let cur=1;
function save(){S.page=cur;try{localStorage.setItem('yki3',JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* speech */
let voice=null,warned=false;
function pick(){voice=speechSynthesis.getVoices().find(v=>/^sv/i.test(v.lang))||null}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick}
const clean=t=>t.replace(/[“”"'’()\[\]{}.,;:!?…→←↔*⋆✓×+=\/]/g,' ').replace(/\s+/g,' ').trim();
function say(txt,el){
 if(!('speechSynthesis' in window)){toast('This browser can’t speak. Try Chrome, Edge or Safari.');return}
 txt=clean(txt);if(!/\p{L}/u.test(txt))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(txt);u.lang='sv-SE';u.rate=S.rate;if(voice)u.voice=voice;
 else if(!warned){warned=true;toast('No Swedish voice found on this device. Add one in your system’s speech settings.')}
 document.querySelectorAll('.say').forEach(x=>x.classList.remove('say'));el.forEach(x=>x.classList.add('say'));
 u.onend=u.onerror=()=>el.forEach(x=>x.classList.remove('say'));speechSynthesis.speak(u)}
/* clicks */
main.addEventListener('click',e=>{
 let t=e.target;
 if(t.classList.contains('lk')){if(t.dataset.u)open(t.dataset.u,'_blank','noopener');else go(+t.dataset.p,+t.dataset.y);return}
 if(t.classList.contains('ph'))t=t.nextElementSibling;
 if(!t||t.tagName!=='text')return;
 const g=t.parentNode,sv=g.classList.contains('sv'),en=g.classList.contains('en');
 if(!sv&&!en)return;
 const hid=(sv&&S.hsv)||(en&&S.hen);
 if(hid&&!t.classList.contains('rv')){
  const set=S.mode==='phrase'?grp(t):[t];
  set.forEach(x=>x.classList.add('rv'))}
 if(sv){if(S.mode==='phrase'){const ts=grp(t).filter(x=>x.tagName==='text');say(ts.map(x=>x.textContent).join(' '),ts)}else say(t.textContent,[t])}});
function grp(t){return [...t.ownerSVGElement.querySelectorAll('text[data-p="'+t.dataset.p+'"]')]}
/* toggles */
function apply(reset){
 document.body.classList.toggle('hsv',!!S.hsv);document.body.classList.toggle('hen',!!S.hen);
 $('#bSv').setAttribute('aria-pressed',!!S.hsv);$('#bEn').setAttribute('aria-pressed',!!S.hen);
 $('#bSv').textContent=S.hsv?'Show Swedish':'Hide Swedish';$('#bEn').textContent=S.hen?'Show English':'Hide English';
 if(reset)document.querySelectorAll('.rv').forEach(x=>x.classList.remove('rv'));save()}
const tg=k=>{S[k]=S[k]?0:1;apply(true)};
$('#bSv').onclick=()=>tg('hsv');$('#bEn').onclick=()=>tg('hen');
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='s'||e.key==='S')tg('hsv');else if(e.key==='e'||e.key==='E')tg('hen')});
$('#sMode').value=S.mode;$('#sMode').onchange=e=>{S.mode=e.target.value;save()};
$('#sRate').value=String(S.rate);if($('#sRate').value!==String(S.rate))$('#sRate').value='0.8';
$('#sRate').onchange=e=>{S.rate=+e.target.value;save()};
/* layout + navigation */
function fit(){main.style.setProperty('--pw',Math.round(Math.min(main.clientWidth-24,900)*S.zoom)+'px')}
function go(n,y){n=Math.max(1,Math.min(N,n||1));const el=document.getElementById('p'+n),k=el.clientWidth/K;
 main.scrollTo({top:el.offsetTop+(y||0)*k-12})}
function zoom(z){const c=cur;S.zoom=Math.max(.5,Math.min(2.6,z));fit();go(c);save()}
$('#zi').onclick=()=>zoom(S.zoom*1.15);$('#zo').onclick=()=>zoom(S.zoom/1.15);$('#zf').onclick=()=>zoom(1);
$('#pj').onkeydown=e=>{if(e.key==='Enter')go(+e.target.value)};
addEventListener('resize',()=>{const c=cur;fit();go(c)});
function side(open){document.body.classList.toggle('noside',!open)}
$('#bSide').onclick=()=>side(document.body.classList.contains('noside'));
/* table of contents */
const nodes=[],st=[{l:0,c:nodes}];
TOC.forEach((e,i)=>{const n={e,i,c:[]};while(st[st.length-1].l>=e[0])st.pop();st[st.length-1].c.push(n);st.push({l:e[0],c:n.c})});
function render(ns,el){ns.forEach(n=>{
 const a=document.createElement('a');a.href='#p'+n.e[2];a.dataset.i=n.i;
 a.innerHTML='<span>'+esc(n.e[1])+'</span><i>'+(LAB[n.e[2]]?'p. '+LAB[n.e[2]]:'')+'</i>';
 a.onclick=ev=>{ev.preventDefault();go(n.e[2]);if(narrow())side(false)};
 if(n.c.length){const d=document.createElement('details'),s=document.createElement('summary');s.appendChild(a);d.appendChild(s);render(n.c,d);el.appendChild(d)}
 else el.appendChild(a)})}
render(nodes,$('#side'));
function mark(){let b=-1;TOC.forEach((e,i)=>{if(e[2]<=cur)b=i});
 document.querySelectorAll('#side a.act').forEach(a=>a.classList.remove('act'));
 const a=document.querySelector('#side a[data-i="'+b+'"]');if(!a)return;a.classList.add('act');
 for(let p=a.parentElement;p&&p.id!=='side';p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;
 a.scrollIntoView({block:'nearest'})}
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){cur=+en.target.id.slice(1);$('#pj').value=cur;mark();save()}}),
 {root:main,rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('.pg').forEach(p=>io.observe(p));
/* start */
if(narrow())side(false);
fit();apply(false);
requestAnimationFrame(()=>go(S.page||1));
</script>
